<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouncing Ball</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .ball { animation: bounce 1.4s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); animation-timing-function: ease-out; }
      50% { transform: translateY(-130px); animation-timing-function: ease-in; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ball { animation: none; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"
       role="img" aria-labelledby="title">
    <title id="title">A gray ball bouncing on the ground</title>
    <line x1="75" y1="234" x2="225" y2="234" stroke="#555" stroke-width="2" />
    <g class="ball">
      <circle cx="150" cy="205" r="28" fill="#555" />
      <circle cx="141" cy="195" r="6" fill="#ddd" />
    </g>
  </svg>
</body>
</html>
