<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouncing Ball</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg"
       width="300" height="300" viewBox="0 0 300 300"
       role="img" aria-labelledby="ball-title">
    <title id="ball-title">A gray ball bouncing on the ground</title>

    <line x1="70" y1="246" x2="230" y2="246"
          stroke="#333" stroke-width="2" />

    <circle cx="150" cy="220" r="25" fill="#555">
      <animate attributeName="cy"
               values="220;65;220"
               keyTimes="0;0.5;1"
               calcMode="spline"
               keySplines="0.2 0.7 0.5 1;0.5 0 0.8 0.3"
               begin="0s" dur="1.2s"
               repeatCount="indefinite" />
    </circle>
  </svg>
</body>
</html>
